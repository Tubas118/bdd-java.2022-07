
spring:
   datasource:
      url: jdbc:h2:mem:bdd-java
      username: sa
      password: pass
      driverClassName: org.h2.Driver
   jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      defer-datasource-initialization: true

application:
   cors-allowed-origins: http://localhost:4200

management:
   endpoints:
      web:
         exposure:
            include: "*"

logging:
   level:
      web: DEBUG